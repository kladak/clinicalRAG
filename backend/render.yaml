# Render Blueprint for the public read-only API.
# Runs the mock LLM path (no API key) with ingest disabled.
services:
  - type: web
    name: clinicalrag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MOCK_LLM
        value: "1"
      - key: ENABLE_INGEST
        value: "0"
      # Set to the canonical frontend origin after the Vercel URL exists.
      - key: CORS_ORIGINS
        sync: false
      - key: CHROMA_PATH
        value: /tmp/chroma_db
      - key: AUDIT_DB_PATH
        value: /tmp/audit.db
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOG_JSON
        value: "1"
      - key: LOG_LEVEL
        value: INFO
