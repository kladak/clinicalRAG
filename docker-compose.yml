# One-command local bring-up for the educational ClinicalRAG demo.
# Frontend talks to the backend via VITE_API_URL.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-your_key_here}
      CHROMA_PATH: /data/chroma_db
      AUDIT_DB_PATH: /data/audit.db
      MOCK_LLM: ${MOCK_LLM:-0}
      LOG_JSON: "1"
      RATE_LIMIT_PER_MINUTE: "60"
      CORS_ORIGINS: "*"
    volumes:
      - clinicalrag-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clinicalrag-data:
  frontend_node_modules:
